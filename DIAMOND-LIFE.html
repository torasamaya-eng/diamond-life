function rollRecordTalent(s){
 // Independent stream preserves the existing genius roll and ordinary career distribution.
 const dice={seed:(s.seed^0x9e3779b9)>>>0};
 if(random(dice)>=RECORD_TALENT_RATE)return;
 const p=s.player;
 p.recordTalent={mode:random(dice)<.35?'multi':'single',focus:Math.floor(random(dice)*6)};
 p.arc=p.recordTalent.mode==='multi'?'recordMulti':'recordSingle';
 p.talent=Math.max(p.talent,p.recordTalent.mode==='multi'?1.85:1.65);
 for(const k in p.abilities){p.abilities[k]=clamp(p.abilities[k]+8,5,99);p.potential[k]=Math.max(p.potential[k],p.recordTalent.mode==='multi'||['meet','power','speed','strikeout','control'].includes(k)?99:90);}

}
function recordStrength(s,key){

 if(t.mode!=='multi'&&keys[t.focus%keys.length]!==key)return 0;

}

 for(const target of RECORD_TARGETS.filter(t=>t.role===s.player.role)){
  for(const scope of r.stage==='pro'?['japan','world']:['world']){
   const id=scope+':'+target.key,previous=s.recordBook[id]??target[scope],value=r.stats[target.key]||0;
   if(value<=previous)continue;

 const sustained=dominant&&activeYears>=c.sustainedYears&&major.length>=c.sustainedTitles&&titleYears>=c.sustainedTitleYears;

// Runtime still exposes the established records[].dailyRoster and rosterHistory APIs.

   const {days,...rest}=value,columns=[...new Set(days.flatMap(d=>Object.keys(d)))];
   const missing=days.map(d=>columns.flatMap((k,i)=>d[k]===undefined?[i]:[]));

const AUTOSAVE_KEY='diamond-life.autosave';
const AUTOSAVE_VERSION=1;
function checksum(text){let hash=2166136261;for(let i=0;i<text.length;i++){hash^=text.charCodeAt(i);hash=Math.imul(hash,16777619);}return (hash>>>0).toString(16);}
function readAutosave(storage){

  storage??=globalThis.localStorage;
  if(!storage)return {exists:false,state:null,error:'このブラウザではオートセーブを利用できません。'};
  const raw=storage.getItem(AUTOSAVE_KEY);if(raw===null)return {exists:false,state:null,error:''};
  const envelope=JSON.parse(raw);
  if(envelope.version!==AUTOSAVE_VERSION)throw Error('対応していない保存バージョンです。');
  if(typeof envelope.payload!=='string'||envelope.checksum!==checksum(envelope.payload))throw Error('保存データが破損しています。');
  const state=expandCareerState(JSON.parse(envelope.payload));
  if(typeof state.careerId!=='string'||!/^DL-[A-Z0-9-]{6,80}$/.test(state.careerId))throw Error('キャリアIDを読み込めません。');
  const migrated=!state.developmentState||Object.keys(DEVELOPMENT_TRAIT_DEFAULTS).some(k=>state.player?.developmentTraits?.[k]==null);
  validate(state);
  const persisted=migrated?writeAutosave(state,storage):{ok:true,error:''};
  return {exists:true,state,error:persisted.error};
 }catch(error){return {exists:true,state:null,error:'保存データを読み込めません。新しい人生を開始できます。'+(error?.message||'')};}
}
function writeAutosave(state,storage){
 try{
  storage??=globalThis.localStorage;

  const payload=JSON.stringify(compactCareerState(state));
  storage.setItem(AUTOSAVE_KEY,JSON.stringify({version:AUTOSAVE_VERSION,savedAt:new Date().toISOString(),checksum:checksum(payload),payload}));
  return {ok:true,error:''};
 }catch(error){return {ok:false,error:'オートセーブに失敗しました。ブラウザの保存設定・空き容量を確認してください。'};}
}

 try{if(!adapter||adapter.ready?.()!==true)return finish('not-ready');}catch{return finish('error');}

const MAX_SAVED_CAREERS=3;
const CAREER_LIBRARY_KEY='diamond-life.retired-careers';
const CAREER_LIBRARY_VERSION=2;
const CAREER_DATABASE='diamond-life.career-library';
function savedCareerLimit(){return MAX_SAVED_CAREERS;}
function checkSavedCareer(entry){
 const state=expandCareerState(entry?.state);
 if(!state?.retired||typeof entry.careerId!=='string'||entry.careerId!==state.careerId||!/^DL-[A-Z0-9-]{6,80}$/.test(entry.careerId))throw Error('保存選手の形式が不正です。');
 validate(state);return {...entry,state};
}
function libraryDb(factory=globalThis.indexedDB){
 return new Promise((resolve,reject)=>{
  if(!factory){reject(Error('IndexedDBを利用できません。ブラウザの保存設定を確認してください。'));return;}
  const request=factory.open(CAREER_DATABASE,1);let blocked=false;
  request.onupgradeneeded=()=>request.result.createObjectStore('careers',{keyPath:'careerId'});
  request.onerror=()=>reject(request.error);request.onblocked=()=>{blocked=true;reject(Error('別のタブを閉じて再試行してください。'));};
  request.onsuccess=()=>{if(blocked)request.result.close();else resolve(request.result);};
 });
}
async function libraryTransaction(mode,operation,options={}){
 const db=await libraryDb(options.indexedDB);
 try{return await new Promise((resolve,reject)=>{
  const tx=db.transaction('careers',mode),store=tx.objectStore('careers');let result;
  tx.oncomplete=()=>resolve(result);tx.onabort=()=>reject(tx.error||Error('保存処理を中止しました。'));tx.onerror=()=>{};
  const request=store.getAll();request.onsuccess=()=>{try{result=operation(store,request.result,tx);}catch(error){tx.abort();reject(error);}};
 });}finally{db.close();}
}
async function migrateCareerLibrary(options={}){
 let raw;
 try{const storage=options.storage??globalThis.localStorage;raw=storage?.getItem(CAREER_LIBRARY_KEY);if(!raw)return {ok:true};
  const data=JSON.parse(raw);if(![1,2].includes(data.version)||!Array.isArray(data.careers))throw Error('旧名鑑の形式が不正です。');
  const valid=[],invalid=[];for(const entry of data.careers){try{const checked=checkSavedCareer(entry);valid.push({...entry,version:CAREER_LIBRARY_VERSION,state:createCareerArchiveSnapshot(checked.state)});}catch{invalid.push(entry?.careerId||'不明');}}
  await libraryTransaction('readwrite',(store,rows)=>{for(const entry of valid)if(!rows.some(r=>r.careerId===entry.careerId))store.put(entry);},options);
  const stored=await libraryTransaction('readonly',(_,rows)=>rows,options);
  for(const entry of valid){const found=stored.find(e=>e.careerId===entry.careerId);checkSavedCareer(found);if(JSON.stringify(found.state)!==JSON.stringify(entry.state))throw Error('旧名鑑との読戻し照合に失敗しました。');}
  if(invalid.length)throw Error('旧名鑑に破損選手があります（'+invalid.join('、')+'）。読める選手は移行し、旧データは保持しました。');
  if(storage.getItem(CAREER_LIBRARY_KEY)===raw)storage.removeItem(CAREER_LIBRARY_KEY);
  return {ok:true};
 }catch(error){return {ok:false,error:'旧名鑑を保持しました。'+error.message};}
}
async function readCareerLibrary(options={}){
 try{
  const migration=await migrateCareerLibrary(options),rows=await libraryTransaction('readonly',(_,r)=>r,options),careers=[],errors=[];
  for(const row of rows){try{careers.push(checkSavedCareer(row));}catch(error){errors.push((row.careerId||'不明')+'：'+error.message);}}
  return {careers,error:[migration.error,...errors].filter(Boolean).join(' ／ '),storedCount:rows.length};
 }catch(error){return {careers:[],error:'選手名鑑を読み込めません。既存データは変更していません。'+error.message};}
}
async function saveRetiredCareer(state,{replaceId=null,limit=savedCareerLimit(),...options}={}){
 try{
  if(!Number.isInteger(limit)||limit<1)throw Error('保存上限の設定が不正です。');
  const entry={careerId:state?.careerId,savedAt:new Date().toISOString(),version:CAREER_LIBRARY_VERSION,state:createCareerArchiveSnapshot(state)};checkSavedCareer(entry);
  const migration=await migrateCareerLibrary(options);if(!migration.ok)throw Error(migration.error);
  // One read-write transaction serializes tabs and double taps. Abort rolls back deletion too.
  return await libraryTransaction('readwrite',(store,rows)=>{
   if(rows.some(r=>r.careerId===entry.careerId))return {ok:true,alreadySaved:true};
   if(replaceId){if(!rows.some(r=>r.careerId===replaceId))throw Error('入れ替える選手が見つかりません。');store.delete(replaceId);}
   else if(rows.length>=limit)return {ok:false,full:true,error:'保存枠がいっぱいです'};
   store.put(entry);return {ok:true};
  },options);
 }catch(error){return {ok:false,error:'選手を保存できません。既存データは変更していません。'+error.message};}
}
async function deleteSavedCareer(careerId,options={}){
 try{
  const migration=await migrateCareerLibrary(options);if(!migration.ok)throw Error(migration.error);
  return await libraryTransaction('readwrite',(store,rows)=>{if(!rows.some(r=>r.careerId===careerId))throw Error('選手が見つかりません。');store.delete(careerId);return {ok:true};},options);
 }catch(error){return {ok:false,error:'削除できません。既存データは変更していません。'+error.message};}
}

 const row=(r,total=false)=>`<tr class="${total?'total-row':''}"><th scope="row">${esc(r.label||r.year)}${!total&&r.age?`<small>${r.age}歳</small>`:''}</th><td>${esc(r.name||r.team||'—')}${r.stage?`<small>${STAGES[r.stage]}${r.pitchRole&&pitcher?' / '+PITCH_ROLES[r.pitchRole]:!pitcher&&r.batterRole?' / '+BATTER_ROLES[r.batterRole]:''}${r.result?' / '+esc(r.result):''}${r.teamResult?' / '+esc(teamResultLabel(r)):''}</small>`:''}</td>${withSalary?`<td class="salary-cell">${Number.isFinite(r.salary)?salaryMoney(r.salary,r.stage==='mlb'||total&&rows.some(x=>x.stage==='mlb')):'—'}</td>`:''}${withAllowance?`<td class="salary-cell">${Number.isFinite(r.firstTeamAllowance)?money(r.firstTeamAllowance):'—'}</td><td class="salary-cell">${Number.isFinite(r.salary)?salaryMoney(r.paidSalary??r.salary,r.stage==='mlb'||total&&rows.some(x=>x.stage==='mlb')):'—'}</td>`:''}${withPaid?`<td class="salary-cell">${Number.isFinite(r.paidSalary)?salaryMoney(r.paidSalary,r.stage==='mlb'||total&&rows.some(x=>x.stage==='mlb')):'—'}</td>`:''}${cells(r.stats).map((v,i)=>`<td${!total&&best[i]!==null&&qualifies(r,labels[i])&&v!=='—'&&Number(v)===best[i]&&(best[i]>0||['防御率','WHIP'].includes(labels[i]))?' class="career-best" title="表示中の年度別成績の最高記録（同記録を含む）"':''}>${v}</td>`).join('')}</tr>`;return `<div class="table-wrap"><table><thead><tr><th>年度 / 大会</th><th>所属 / 詳細</th>${withSalary?'<th>契約年俸</th>':''}${withAllowance?'<th>一軍追加報酬</th><th>年俸＋追加報酬</th>':''}${withPaid?'<th>今季実支給額</th>':''}${labels.map(l=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${summary?row({label:'通算',team:`${rows.length} 件の合計`,stats:sumStats(rows),salary:withSalary?rows.reduce((n,r)=>n+(r.salary||0),0):undefined,firstTeamAllowance:withAllowance?rows.reduce((n,r)=>n+(r.firstTeamAllowance||0),0):undefined,paidSalary:withSalary?rows.reduce((n,r)=>n+(r.paidSalary??r.salary??0),0):undefined},true):''}${rows.slice().sort((a,b)=>(a.year||0)-(b.year||0)).map(r=>row(r)).join('')}</tbody></table></div>`;}
function statsView(){if(recordType==='roster')return rosterHistoryView();const cupName={wbc:'世界野球選手権',olympics:'世界スポーツ大会'}[recordType];const cupHistory=cupName?s.nationalHistory.filter(r=>r.name===cupName):[];let rows=cupName?cupHistory.filter(r=>r.selected&&r.participated!==false&&r.stats).map(r=>({...r,label:r.year+' / '+(r.result||'結果未記録')})):recordType==='first'||recordType==='second'?levelRows(s.records,recordType):recordType==='pro'?s.records.filter(r=>['pro','independent','mlb'].includes(r.stage)):recordType==='minor'?s.records.filter(r=>r.stage==='mlb'&&r.levels?.second).map(r=>({...r,stats:r.levels.second})):recordType==='mlb'?s.records.filter(r=>r.stage==='mlb'):recordType==='year'?s.records:recordType==='koshien'?s.tournaments.filter(t=>t.koshien):s.tournaments;if(filter!=='all'&&!['pro','first','second','mlb','minor','wbc','olympics'].includes(recordType))rows=rows.filter(r=>r.stage===filter);return `${heading('THE RECORD BOOK','成績を振り返る','小さな一打も、大舞台の一球も。すべての数字を、ずっと。')}<section class="panel"><div class="filter-row"><div class="tabs">${[['year','年度別'],['pro','プロ通算・タイトル'],['first','国内プロ一軍'],['second','国内プロ二軍'],['mlb','メジャー成績'],['minor','マイナー成績'],['roster','登録・抹消'],['tournament','大会別'],['koshien','甲子園'],['wbc','世界野球選手権'],['olympics','世界スポーツ大会']].map(([id,label])=>`<button data-action="record-type" data-id="${id}" class="${recordType===id?'active':''}">${label}</button>`).join('')}</div><label ${['pro','first','second','mlb','minor','wbc','olympics'].includes(recordType)?'hidden':''}>時代 <select id="record-filter"><option value="all">すべて</option>${Object.entries(STAGES).map(([id,label])=>`<option value="${id}" ${filter===id?'selected':''}>${label}</option>`).join('')}</select></label></div><div class="tabs stat-categories" aria-label="成績の種類">${[['main',s.player.role==='pitcher'?'投手成績':'打撃成績'],['fielding','守備成績']].map(([id,label])=>button('stat-category',label,statCategory===id?'active':'','data-id="'+id+'" aria-pressed="'+(statCategory===id)+'"')).join('')}</div>${statCategory==='fielding'?'<p class="micro">試合は守備に就いた試合数。併殺は守備で参加した併殺数です。送球失策は失策の内数。肩力は補殺・併殺、送球の正確さは送球失策に影響します。守備率＝（刺殺＋補殺）÷（刺殺＋補殺＋失策）。守備機会なし・未記録は「—」、未記録を含む通算も「—」です。</p>':''}<p class="micro">${cupName?'代表戦はシーズン・プロ通算成績と別集計です。辞退・選出なしは通算に含みません。':['first','second'].includes(recordType)?'国内プロのみ。一軍と二軍は別集計。年俸と一軍追加報酬は一・二軍共通です。二重に合算しません。更新前の区分不明な記録は含めません。':recordType==='pro'?'国内・海外プロ・独立リーグの合計。新記録は一軍・メジャーのみ。二軍・マイナー・代表戦を含みません。':recordType==='minor'?'海外マイナーの成績。メジャー・プロ通算には含みません。年俸は球団との共通契約額で、メジャー欄とは重複加算しません。':recordType==='mlb'?'海外メジャーの年度別・通算成績です。':recordType==='year'?'年度末に確定した成績。国内プロの新記録は一軍成績です。学生の年度成績には大会の成績を含みます。':'大会成績は年度成績の内数です。代表戦は別集計です。'} 通算率は合計の打数・投球回から算出します。追加前の詳細項目は「—」です。過去の数値は推測で埋めません。</p>${cupName?`<h2>${cupName}</h2><p>${rows.length}回出場 ／ ${rows.filter(r=>r.result==='優勝').length}回優勝</p>`:''}${['mlb','minor'].includes(recordType)?'<h2>'+(recordType==='mlb'?'メジャー':'マイナー')+'年度別・通算成績</h2>':''}<p class="micro">赤字は表示中の年度別成績の最高記録（同記録を含む）。率は規定相当の機会数を満たす年度で比較します。</p>${table(rows,true,statCategory,['year','pro','first','second','mlb','minor'].includes(recordType))}${cupName?`<details open><summary>代表選考・出場履歴</summary>${cupHistory.length?cupHistory.slice().sort((a,b)=>a.year-b.year).map(r=>`<p>${r.year}年${r.age?'（'+r.age+'歳）':''} ／ ${r.participated===false?'招集・辞退':r.selected?'出場・'+esc(r.result||'結果未記録'):'選出なし'}</p>`).join(''):'<p class="empty">開催年の選考結果はまだありません。</p>'}</details>`:''}${recordType==='pro'?`<details open><summary>獲得タイトル ${s.awards.length}件</summary>${s.awards.map(awardRow).join('')||'<p>獲得タイトルはまだありません。</p>'}</details>`:''}</section>${recordType==='year'&&s.current.games&&!s.records.some(r=>r.year===s.year)?`<section class="panel"><h2>${s.year}年 進行中の成績</h2>${table([{year:s.year,team:s.team,stats:s.current}],false,statCategory)}</section>`:''}`;}
function salaryChart(){if(!s.contracts.length)return '<p class="empty">プロ入り後、年俸の推移がここに残ります。</p>';const arr=s.contracts,max=Math.max(...arr.map(c=>c.salary),1);return `<div class="salary-chart" role="img" aria-label="年俸推移。下の契約履歴で金額を確認できます。">${arr.map(c=>`<div title="${c.year}年 ${displaySalary(c.salary,salaryStage(c))}"><i style="height:${Math.max(3,c.salary/max*110)}px"></i><span>${String(c.year).slice(2)}</span></div>`).join('')}</div><div class="table-wrap"><table><thead><tr><th>年度</th><th>所属</th><th>年俸</th><th>来季契約</th><th>登録状況</th></tr></thead><tbody>${arr.slice().sort((a,b)=>a.year-b.year).map(c=>`<tr><td>${c.year}</td><td>${esc(c.team)}</td><td>${displaySalary(c.salary,salaryStage(c))}</td><td>${displaySalary(c.nextSalary,salaryStage(c))}</td><td>${esc(c.roster)}</td></tr>`).join('')}</tbody></table></div>`;}
function championshipView(){const rows=s.records.filter(r=>r.teamResult&&['pro','mlb'].includes(r.stage));if(!rows.length)return '';return `<section class="panel"><h2>チームの優勝歴</h2><p class="micro">所属球団の一軍実績です。二軍・育成所属時も球団の優勝として記録します。海外のリーグ優勝は上位3球団によるポストシーズンの勝者で、ワールドシリーズに進出します。</p>${[['pro','国内','日本一','japanChampion'],['mlb','海外','ワールドシリーズ優勝','worldChampion']].map(([stage,label,title,key])=>{const entries=rows.filter(r=>r.stage===stage);const winners=entries.filter(r=>r.teamResult.leagueChampion||r.teamResult[key]).sort((a,b)=>a.year-b.year);return `<h3 class="subheading">${label}</h3><p>リーグ優勝 ${entries.filter(r=>r.teamResult.leagueChampion).length}回 ／ ${title} ${entries.filter(r=>r.teamResult[key]).length}回</p>${winners.length?winners.map(r=>`<p>${r.year}年（${r.age??CONFIG.startAge+r.year-CONFIG.startYear}歳） ${esc(r.team)}：${r.teamResult.leagueChampion?'リーグ優勝':''}${r.teamResult[key]?' ／ '+title:''}</p>`).join(''):'<p class="micro">優勝の記録はまだありません。</p>'}`;}).join('')}</section>`;}
function incomeBreakdown(){return '<details class="panel"><summary>選手収入の内訳</summary><p>生涯基本給与 '+careerSalary(Math.max(0,(s.totalSalary||0)-(s.totalFirstTeamAllowance||0)))+'</p><p>一軍追加参稼報酬 '+money(s.totalFirstTeamAllowance||0)+'</p><p>契約金 '+money(s.totalSigningBonus||0)+' ／ 支度金 '+money(s.totalSetupAllowance||0)+' ／ 出来高 '+careerSalary(s.totalIncentives||0)+'</p><p>生涯収入 '+careerSalary(careerIncome(s))+'</p><small>球団への譲渡金は含みません。旧記録の未集計額は推測しません。</small></details>';}
function career(){return `${s.retired?'<section class="panel"><h2>一言寸評</h2><p>'+esc(careerReview(s))+'</p></section>':''}${heading('YOUR BASEBALL STORY',s.retired?'最後の一球、その先に。':'あなたの足跡',`${esc(s.player.name)} / ${s.year-CONFIG.startYear}年の歩み`)}<div class="career-metrics"><div><span>記録された年度</span><strong>${s.records.length}<small>年</small></strong></div><div><span>プロ実働</span><strong>${s.proYears}<small>年</small></strong></div><div><span>生涯年俸</span><strong class="money">${careerSalary(s.totalSalary)}</strong></div><div><span>代表出場</span><strong>${s.nationalHistory.filter(n=>n.selected&&n.participated!==false).length}<small>大会</small></strong></div></div><div class="two-columns"><details class="panel career-timeline"><summary>キャリア年表（${s.timeline.length}件）</summary><div class="full-timeline">${s.timeline.slice().sort((a,b)=>a.year-b.year).map(t=>`<div><b>${t.year}<small>${t.age??(CONFIG.startAge+t.year-CONFIG.startYear)}歳</small></b><p>${esc(t.text)}</p></div>`).join('')}</div></details><div>${championshipView()}<details class="panel"><summary>獲得タイトル・表彰</summary>${s.awards.map(awardRow).join('')||'<p>記録なし</p>'}</details><details class="panel"><summary>所属・契約・年俸</summary>${teamHistory()}${salarySummary()}${salaryChart()}</details>${incomeBreakdown()}${honorsView()}${allStarView()}</div></div><div class="career-histories"><section class="panel"><h2>ドラフト履歴</h2>${s.drafts.length?s.drafts.map(d=>`<div class="draft-entry"><b>${d.year}年 / ${d.type}${d.rank?' '+d.rank+'位':''}</b><p>${esc(d.team||'次の舞台で再挑戦')}</p><small>評価 ${d.score} / 100${d.rank?` ・ 年俸 ${money(d.salary)} ・ ${d.type==='育成'?'支度金':'契約金'} ${money(d.type==='育成'?(d.setupAllowance??d.bonus):d.bonus)}`:''}</small></div>`).join(''):'<p class="empty">高校3年の終了時に、最初のドラフトを迎えます。</p>'}</section>${injuryView()}</div>${s.retired?careerHigh():''}${s.retired&&!libraryViewing?'<div class="career-actions">'+button('share-result','結果をシェア','primary')+button('library-save','この選手を保存','primary')+button('library-open','選手名鑑','secondary')+'</div>':''}`;}
function teamHistory(){return `<div class="team-history">${s.teams.map(t=>`<div><b>${t.year}〜</b><span>${esc(t.team)}</span><small>${STAGES[t.stage]}${s.jerseyHistory?.find(j=>j.year===t.year&&j.team===t.team)?' / #'+s.jerseyHistory.find(j=>j.year===t.year&&j.team===t.team).number:''}</small></div>`).join('')}</div>`;}
function teamView(){return `${heading('CONTRACT','所属・契約',esc(s.team))}${isPro(s)?salarySummary():''}${clockView()}${roleControls()}${postingGoalView()}<section class="panel"><h2>これからの進路</h2><div class="quick-links">${!s.retired?button('market-menu','移籍を相談する','secondary')+button('retire','引退を選ぶ','danger'):''}${s.contractOffers.length?button('next-popup','契約提示を確認','primary'):''}</div><p>現役の上限は50歳。衰えや出場減少によって、戦力外やコーチ就任の打診があります。</p></section><section class="panel"><h2>所属履歴</h2>${teamHistory()}</section><details class="panel"><summary>年俸設定の参考資料</summary><p class="micro">実例を参考にした独自の査定です。実在選手の年俸を再現するものではありません。海外年俸は1ドル${CURRENCY.usdJpy}円の固定換算を基準にしています。</p>${SALARY_SOURCES.map(x=>`<p><a href="${x.url}" target="_blank" rel="noopener">${x.label}</a></p>`).join('')}</details>`;}

function showNextPopup(){render();if(s.retired)return;if(s.rosterDecision)return rosterDecisionDialog();if(s.injuryAdvice)return injuryAdviceDialog();if(s.participationReport)return participationReportDialog();if(s.nationalOffers?.length)return nationalOfferDialog();if(s.employment)return employmentDialog();if(s.postingReport)return postingResultDialog();if(s.market&&!s.market.closed&&s.market.year===s.year)return marketDialog();if(s.retirementAdvice&&!s.retirementAdvice.answered)return adviceDialog();if(s.youthNotice)return youthDialog();if(s.scoutPopup)return scoutDialog();if(s.pending)return choiceDialog();const notice=s.notices.find(n=>!n.seen&&n.year===s.year);if(notice)return noticeDialog(notice);if(s.contractOffers.length)return renewalDialog();}
function contractDock(action,id,label,annual,years,stage=s.stage){return '<footer class="contract-dock"><div><b>'+esc(label)+'（選択中）</b><span>'+displaySalary(annual,stage)+' ／ '+years+'年契約</span></div>'+button(action,'この契約に合意','primary', 'data-id="'+esc(id)+'"')+'</footer>';}

 const chosen=s.contractOffers.find(o=>o.id===selectedId)||s.contractOffers[0];if(!chosen)return;
 const title=o=>o.payScale?'海外・昇降格連動契約':o.development?'育成契約・リハビリ':s.stage==='pro'?(s.contractStatus==='development'?'育成契約':'支配下契約'):'選手契約';
 openDialog('<div class="dialog-head"><h2>契約更改の提示</h2>'+button('close','×','icon-button','aria-label="閉じる"')+'</div><div class="contract-body">'+clockView()+'<p class="micro">年俸は1年分。国内支配下420万円・育成240万円が下限。一軍追加参稼報酬は基本年俸と別計算。複数年契約は期間中保証されます。</p><div class="path-options">'+s.contractOffers.map(o=>'<div class="path-card contract-card '+(o.id===chosen.id?'contract-selected':'')+'"><h3>'+title(o)+' ／ '+o.years+'年</h3><strong class="offer-salary">年俸 '+displaySalary(o.annual)+'</strong><p>前年 '+displaySalary(s.salary)+' → '+displaySalary(o.annual)+'<br>'+displaySalaryDifference(s.salary,o.annual)+'<br>総額 '+displaySalary(o.annual*o.years)+' ／ '+o.year+'〜'+(o.year+o.years-1)+'年</p>'+(o.payScale?'<p>マイナー年額 '+displaySalary(o.payScale.minorAnnual)+' ／ メジャー年額 '+displaySalary(o.payScale.majorAnnual)+'。在籍日数で按分し、上記総額は現在の所属で通年在籍した場合の目安です。</p>':'')+(o.reason?'<p>'+esc(o.reason)+'</p>':'')+incentiveText(o.incentive)+button('sign-contract','この契約に合意','primary contract-desktop','data-id="'+o.id+'"')+(s.contractOffers.length>1?button('contract-select',o.id===chosen.id?'選択中':'この契約を選択','secondary contract-select','data-id="'+o.id+'" aria-pressed="'+(o.id===chosen.id)+'"'):'')+'</div>').join('')+'</div><div class="quick-links">'+(s.contractOffers.some(o=>o.id==='rehab')?button('rehab-decline','育成再契約を断り他球団を探す','secondary'):button('market-menu','移籍も検討する','secondary'))+button('retire','引退を選ぶ','danger')+'</div></div>'+contractDock('sign-contract',chosen.id,title(chosen),chosen.annual,chosen.years),'contract-dialog');
}
function employmentDialog(){const e=s.employment;openDialog(`<div class="dialog-head"><h2>${e.type==='released'?'戦力外通告':'引退後の仕事の打診'}</h2>${button('close','×','icon-button','aria-label="閉じる"')}</div><p>${esc(e.from)}から${e.type==='released'?'来季の選手契約を結ばないと伝えられました。':'指導者・球団職員への転身を打診されました。現役続行も選べます。'}</p><div class="path-options">${e.options.map(o=>`<div class="path-card"><h3>${STAFF_ROLES[o.role]?STAFF_ROLES[o.role].label+'に就任':o.id==='stay'?'現役を続ける':esc(o.team)+'で続行'}</h3><p>${esc(o.team)}${o.attention?'<br><strong>★ '+esc(o.attention)+'</strong>':''}<br>${o.salary?'年俸 '+displaySalary(o.salary,o.stage):'社会人野球・プロ年俸なし'}</p>${STAFF_ROLES[o.role]?'<p>選手として引退し、その後の人生を文章で振り返ります。</p>':''}${button('employment','この道を選ぶ','primary',`data-id="${o.id}"`)}</div>`).join('')}</div><div class="quick-links">${button('retire','現役引退を選ぶ','danger')}</div>`);}
function noticeDialog(n){openDialog(`<div class="dialog-head"><h2>${esc(n.title)}</h2>${button('close','×','icon-button','aria-label="閉じる"')}</div><p>${esc(n.body)}</p><div class="dialog-actions">${button('notice-open','交渉してみる','primary',`data-id="${n.kind}"`)}${button('notice-skip','今回は見送る','secondary')}</div>`);}
function marketDialog(selectedId){const board=s.market;if(!board)return;const chosen=board.offers.find(o=>o.id===selectedId)||board.offers[0];openDialog('<div class="dialog-head"><h2>交渉結果</h2>'+button('close','×','icon-button','aria-label="閉じる"')+'</div><div class="contract-body"><p>'+esc(board.message)+'</p>'+(board.closed?'<p>この交渉は終了しています。次のシーズンに再び交渉できます。</p>':'<div class="path-options">'+board.offers.map(o=>'<div class="path-card contract-card '+(o.id===chosen?.id?'contract-selected':'')+'"><h3>'+esc(o.team)+'</h3><strong class="offer-salary">年俸 '+displaySalary(o.salary,o.stage)+'</strong><p>'+(o.years||1)+'年契約 ／ 総額 '+displaySalary(o.salary*(o.years||1),o.stage)+'<br>'+o.role+' ／ '+(o.stage==='mlb'?'海外プロ':'国内プロ')+'</p>'+overseasTerms(o)+offerTerms(o)+button('offer','この条件で移籍する','primary contract-desktop','data-id="'+o.id+'"')+(board.offers.length>1?button('market-select',o.id===chosen?.id?'選択中':'この契約を選択','secondary contract-select','data-id="'+o.id+'" aria-pressed="'+(o.id===chosen?.id)+'"'):'')+'</div>').join('')+'</div>'+button('remain',['fa','overseasFa'].includes(board.kind)?'FAを行使して残留する':'今の球団に残る','secondary wide'))+'</div>'+(!board.closed&&chosen?contractDock('offer',chosen.id,chosen.team,chosen.salary,chosen.years||1,chosen.stage):''),'contract-dialog');}
function adviceDialog(){const a=s.retirementAdvice;if(!a||a.answered)return;openDialog(`<div class="dialog-head"><h2>球団からの引退勧告</h2>${button('close','×','icon-button','aria-label="閉じる"')}</div><p>${esc(a.reason)}</p><p>現在の所属と年俸で現役続行できます。続けるか、区切りをつけるかはあなたが決めます。</p><div class="dialog-actions">${button('continue-career','現役を続ける','primary')}${button('retire','引退を考える','danger')}</div>`);}
function nationalTables(){return [...YOUTH_CUPS.map(c=>c.name),'世界野球選手権','世界スポーツ大会'].map(name=>{const rows=s.nationalHistory.filter(n=>n.selected&&n.participated!==false&&n.name===name).map(n=>({...n,label:`${n.year} / ${n.result}`,name}));return `<h3 class="subheading">${name} <span>${rows.length}回出場 / ${rows.filter(r=>r.result==='優勝').length}回優勝</span></h3>${table(rows)}`;}).join('');}
function nationalView(){const upcoming=[];for(let y=s.year;y<s.year+12;y++)for(const name of [...calendar(y),...YOUTH_CUPS.filter(c=>y>=c.start&&(y-c.start)%c.cycle===0).map(c=>c.name)])upcoming.push({year:y,name});return `${heading('BEYOND THE DIAMOND','日本代表','自分の一球が、国の一球になる。')}<section class="national-banner"><span>JAPAN NATIONAL TEAM</span><h2>世界の舞台へ。</h2><p>小・中・高校では年代別世界大会、プロでは世界野球選手権・世界スポーツ大会の代表を能力と成績で選考。<br>開催年だけに訪れる、特別なチャンス。</p><strong>${s.nationalHistory.filter(n=>n.selected).length}<small>代表大会</small></strong></section><div class="calendar-cards">${upcoming.slice(0,4).map(n=>`<div><span>${n.name}</span><strong>${n.year}</strong><small>ゲーム内開催予定</small></div>`).join('')}</div><p class="micro">U12・U15・U18世界大会は2年周期の架空大会。対象は小学10歳以上・中学生・高校生です。世界野球選手権は2026年から4年周期。世界スポーツ大会は2028年から4年周期、2032年は野球なしのゲーム設定。将来の実開催予定を示すものではありません。</p><section class="panel">${nationalTables()}</section><section class="panel"><h2>代表選考の履歴</h2>${s.nationalHistory.length?`<ul class="news">${s.nationalHistory.slice().reverse().map(n=>`<li><b>${n.year}</b>${n.name} / ${n.participated===false?'招集・辞退':n.selected?'選出・'+n.result:'選出なし'}</li>`).join('')}</ul>`:'<p class="empty">対象年代の開催年に選考結果が記録されます。</p>'}</section>`;}
function finalCareer(){return `<div class="retired-banner"><div class="eyebrow">THE LAST PITCH, A LIFETIME OF MEMORIES</div><h1>${esc(s.player.name)}、現役引退。</h1><p>${s.records[0]?.year||CONFIG.startYear} — ${s.year} / ${s.age}歳。すべての一球が、あなたの物語。</p></div>${afterlifeView()}${s.postCareer?`<section class="panel"><h2>引退後：${esc(s.postCareer.team)}の${esc(s.postCareer.role)}</h2><p>就任時年俸 ${money(s.postCareer.salary)}（選手の生涯年俸には含めません）</p></section>`:''}${career()}${careerHigh()}`;}
function openDialog(html,kind=''){const d=$('#modal');if(d.open)d.close();d.className=kind;d.innerHTML=html;d.showModal();}const closeDialog=()=>$('#modal').close();
function confirm(title,body,action){openDialog(`<div class="dialog-head"><h2>${title}</h2>${button('close','×','icon-button','aria-label="閉じる"')}</div><p>${body}</p><div class="dialog-actions">${button('close','キャンセル','secondary')}${button(action,'確定する','primary')}</div>`);}
function randomizePlayerForm(){const form=$('#new-player');if(!form)return;for(const name of ['role','throwHand','batHand','positionGroup','position','style','pitchStyle']){const field=form.elements.namedItem(name);field.selectedIndex=Math.floor(Math.random()*field.options.length);}$('#batter-options').hidden=form.elements.namedItem('role').value!=='batter';$('#pitcher-options').hidden=form.elements.namedItem('role').value!=='pitcher';$('#infield-options').hidden=form.elements.namedItem('positionGroup').value!=='infield';$('#outfield-note').hidden=form.elements.namedItem('positionGroup').value!=='outfield';}
function newPlayerDialog(){openDialog(`<div class="dialog-head"><div><div class="eyebrow">A NEW BEGINNING</div><h2>あなたの野球人生を始めよう。</h2></div>${button('close','×','icon-button','aria-label="閉じる"')}</div><p>6歳の春、はじめてのユニフォーム。</p><form id="new-player"><button type="button" data-action="random-player" class="secondary wide">ランダム</button><p class="micro">選手名以外のポジション・投打・守備位置・スタイルをまとめて設定します。ランダムを押すと、そのままゲームが始まります。</p><label>選手名<input name="name" maxlength="24" value="${esc(randomPlayerName())}" required autocomplete="off"></label><label>ポジション<select name="role"><option value="pitcher">投手</option><option value="batter">野手</option></select></label><div class="two-columns">${['throwHand','batHand'].map((key,i)=>`<label>${i?'打つ手':'投げる手'}<select name="${key}">${Object.entries(HANDS).map(([id,n])=>`<option value="${id}">${n}${i?'打ち':'投げ'}</option>`).join('')}</select></label>`).join('')}</div><div id="batter-options" hidden><label>守備区分<select name="positionGroup"><option value="infield">内野手</option><option value="outfield">外野手</option><option value="catcher">捕手</option></select></label><label id="infield-options">守備位置<select name="position">${['first','second','third','shortstop'].map(id=>`<option value="${id}">${POSITIONS[id]}</option>`).join('')}</select></label><p id="outfield-note" class="micro" hidden>外野の守備位置（左・中・右）はチームに任せます。</p><label>プレイスタイル<select name="style">${['balanced','average','power'].map(id=>`<option value="${id}">${STYLES[id].name}</option>`).join('')}<optgroup label="その他のスタイル"><option value="speed">韋駄天</option><option value="defense">守備職人</option></optgroup></select></label></div><label id="pitcher-options">投手スタイル<select name="pitchStyle">${Object.entries(PITCH_STYLES).map(([id,v])=>`<option value="${id}">${v.name}</option>`).join('')}</select></label><p class="micro">進行はこのブラウザに自動保存されます。保存された人生は開始画面の「続きから」で再開できます。</p><button type="submit" class="primary wide">グラウンドへ →</button></form>${button('library-open','マイ選手名鑑','secondary wide')}${gamePublicLinks()}`);}
function choiceDialog(){const p=s.pending;if(!p)return;const middle=p.type==='middle',high=p.type==='high';const draftInfo=p.type==='career'?`<div class="draft-result"><span>${p.draft.year} DRAFT</span><h3>${p.draft.returning?'国内プロ復帰の交渉':p.draft.type==='指名なし'?'今回は、指名なし。':`${p.draft.type==='育成'?'育成':''}ドラフト ${p.draft.rank}位指名`}</h3><p>${esc(p.draft.team||'野球人生は、まだ続く。次の道を選ぼう。')}</p><p>独立リーグ入団テスト：${p.draft.independentOffer?'合格・入団可能':'合格オファーなし'}</p>${p.draft.rank?`<p>基本年俸（1年分）：${money(p.draft.salary)}</p><p>${p.draft.type==='育成'?'支度金':'契約金'}（入団時・年俸とは別）：${money(p.draft.type==='育成'?(p.draft.setupAllowance??p.draft.bonus):p.draft.bonus)}</p>`:''}</div>`:'';let choices=middle?MIDDLE:high?SCHOOLS.filter(c=>c.active!==false).slice().sort((a,b)=>Number(s.schoolOffers.some(o=>o.id===b.id))-Number(s.schoolOffers.some(o=>o.id===a.id))):ROUTES.filter(r=>mayEnterUniversity(s)||!['university','overseas'].includes(r.id));if(p.type==='career'){choices=choices.filter(r=>r.id!==s.stage&&(r.id!=='independent'||p.draft.independentOffer));for(const o of p.draft.returnOffers||[])choices.unshift({id:o.id,name:o.team,tag:'国内プロ復帰契約',desc:'新人ドラフトを経ずに復帰。年俸 '+money(o.salary)+' ／ 契約金・支度金の再支給なし'});if(p.draft.type!=='指名なし'&&corporateDraftEligibility(s).eligible)choices=[{id:'pro',name:p.draft.team,tag:'NPB相当のプロへ',desc:`提示条件で入団する。初年度年俸 ${money(p.draft.salary)}。`},...choices];if(p.draft.overseasOffer)choices=[{id:'mlb',name:p.draft.overseasOffer.team,tag:'海外ドラフト '+p.draft.overseasOffer.rank+'巡目（巡別近似）',desc:'海外新人契約・マイナーから開始。年俸 '+money(p.draft.overseasOffer.salary)+' ／ 契約金 '+money(p.draft.overseasOffer.bonus||0)+' ／ メジャー昇格時 '+money(p.draft.overseasOffer.payScale?.majorAnnual||SALARY_MODEL.mlbFloor)+'相当（日割り）'},...choices];if(['corporate','independent'].includes(s.stage))choices=[{id:'stay',name:s.team,tag:'現在の所属で続行',desc:p.draft.returning?'もう1年プレーし、国内プロ復帰の評価を待つ。':'もう1年力を蓄え、次のドラフトへ。'},...choices];}openDialog(`<div class="dialog-head"><div><div class="eyebrow">CHOOSE YOUR PATH</div><h2>${middle?'中学での舞台を選ぶ':high?'高校、3年間の選択。':'次の夢を、選ぼう。'}</h2></div>${button('close','×','icon-button','aria-label="閉じる"')}</div>${draftInfo}<div class="path-options">${choices.map(c=>`<button data-action="choose" data-id="${c.id}" class="path-card ${high&&s.schoolOffers.some(o=>o.id===c.id)?'recruited':''}"><span class="tag">${high&&s.schoolOffers.some(o=>o.id===c.id)?'★ 推薦オファーあり ／ ':''}${c.tag}</span><h3>${esc(c.name)}</h3><p>${c.desc}</p>${high?schoolDetails(c):middle?middleDetails(c):''}<b class="path-arrow">この道へ →</b></button>`).join('')}</div><p class="micro">${high?'学校ごとに競争の厳しさや出場機会が異なります。':p.type==='career'?'大学進学は高校卒業時のみ選択可能。大学卒業後はプロ・社会人・独立リーグへ進みます。':'硬式クラブは試合数と注目度が高め。軟式は出場機会を得やすい環境です。'}</p>`);}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;e.preventDefault();const a=b.dataset.action,id=b.dataset.id;if(newCareerTransition||libraryBusy)return;try{if(a==='site-top'){libraryRequest++;rememberSite('top');render();}else if(a==='site-game'){rememberSite('game');render();}else if(a==='library-open'){libraryCandidate=null;await openCareerLibrary();}else if(a==='library-save'){if(!s?.retired)return;libraryCandidate=s;libraryBusy=true;const result=await saveRetiredCareer(s);libraryBusy=false;if(result.ok)libraryCandidate=null;await openCareerLibrary(result.ok?(result.alreadySaved?'この選手は保存済みです。':'選手を保存しました。'):result.error);}else if(a==='library-view'){await viewSavedCareer(id);}else if(a==='library-delete'||a==='library-replace'){await confirmLibraryChange(id,a==='library-replace');}else if(a==='library-confirm'){if(!libraryConfirmation||libraryConfirmation.id!==id)return;libraryBusy=true;const result=await (libraryConfirmation.replace?saveRetiredCareer(libraryCandidate,{replaceId:id}):deleteSavedCareer(id));libraryBusy=false;libraryConfirmation=null;if(result.ok)libraryCandidate=null;await openCareerLibrary(result.ok?'名鑑を更新しました。':result.error);}else if(a==='library-back'){libraryConfirmation=null;await openCareerLibrary();}else if(a==='final-career'){openFinalCareer();}else if(a==='share-result'){showCareerShare().catch(err=>showError(err.message));}else if(a==='share-x'){if(sharedCareer){try{window.open(sharedCareer.xUrl,'_blank','noopener,noreferrer');$('#share-status').textContent='Xが開かない場合は、文章コピーをご利用ください。';}catch{$('#share-status').textContent='Xの投稿画面を開けませんでした。文章コピーをご利用ください。';}}}else if(a==='share-send'){if(sharedCareer)shareCareerFile(sharedCareer).then(ok=>{if(!ok)$('#share-status').textContent='画像保存または文章コピーをご利用ください。';});}else if(a==='share-download'){if(sharedCareer){const url=URL.createObjectURL(sharedCareer.blob),link=document.createElement('a');link.href=url;link.download=sharedCareer.filename;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}}else if(a==='share-copy'){copyCareerShare();}else if(a==='resume'){const loaded=readAutosave();if(!loaded.state){savedCareer=loaded;saveMessage=loaded.error;render();return;}s=loaded.state;rememberSite('game');saveMessage='';tab='play';closeDialog();showNextPopup();}else if(a==='confirm-new'){confirmNewLife();}else if(a==='roster-choice'){const result=resolveRosterDecision(s,id);closeDialog();render();if(result)rosterResultDialog(result);else showNextPopup();}else if(a==='roster-result-dismiss'){closeDialog();showNextPopup();}else if(a==='nav'){closeDialog();tab=b.dataset.tab;render();window.scrollTo(0,0);}else if(['career','stats','abilities','settings'].includes(a)){tab=a;render();window.scrollTo(0,0);}else if(a==='advance'||a==='year'){a==='year'?advanceYear(s):advance(s);render();showNextPopup();}else if(a==='national-accept'||a==='national-decline'){decideNational(s,a==='national-accept');closeDialog();render();showNextPopup();}else if(a==='participation-dismiss'){s.participationReport=null;closeDialog();render();showNextPopup();}else if(a==='news'){openDialog('<div class="dialog-head"><h2>最近の出来事</h2>'+button('close','×','icon-button')+'</div><ul class="news">'+s.news.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>');}else if(a==='level-summary'){openDialog('<div class="dialog-head"><h2>所属区分ごとの成績</h2>'+button('close','×','icon-button')+'</div>'+farmSummary().replace('<details class="panel">','<details class="panel" open>'));}else if(a==='youth-dismiss'){s.youthNotice=null;closeDialog();render();showNextPopup();}else if(a==='scout-dismiss'){s.scoutPopup=false;closeDialog();render();showNextPopup();}else if(a==='pitch-wish'){requestPitchRole(s,id);render();}else if(a==='profile-save'){configurePlayer(s,$('#position-choice').value,$('#style-choice').value);render();}else if(a==='injury-continue'){continueAfterInjury(s);closeDialog();showNextPopup();}else if(a==='posting-alternative'){selectPostingAlternative(s,id);closeDialog();showNextPopup();}else if(a==='posting-dismiss'){s.postingReport=null;closeDialog();showNextPopup();}else if(a==='next-popup')showNextPopup();else if(a==='market-menu')marketMenu();else if(a==='contract-select'){renewalDialog(id);}else if(a==='market-select'){marketDialog(id);}else if(a==='rehab-decline'){declineRehab(s);closeDialog();showNextPopup();}else if(a==='sign-contract'){signRenewal(s,id);closeDialog();render();showNextPopup();}else if(a==='employment'){chooseEmployment(s,id);closeDialog();render();showNextPopup();}else if(a==='notice-open'){const n=s.notices.find(n=>!n.seen&&n.year===s.year);if(n)n.seen=true;const reason=eligibility(s,id);if(reason){closeDialog();showNextPopup();showError(reason);}else{negotiate(s,id);marketDialog();}}else if(a==='notice-skip'){const n=s.notices.find(n=>!n.seen&&n.year===s.year);if(n)n.seen=true;closeDialog();showNextPopup();}else if(a==='more'){openDialog('<div class="dialog-head"><h2>メニュー</h2>'+button('close','×','icon-button','aria-label="閉じる"')+'</div><div class="more-menu">'+nav.slice(3).map(([id,icon,label])=>button('nav',label,'secondary','data-tab="'+id+'"')).join('')+'</div>');}else if(a==='negotiate'){negotiate(s,id);marketDialog();}else if(a==='offer'){acceptOffer(s,id);s.postingReport=null;closeDialog();render();showNextPopup();}else if(a==='remain'){s.postingReport=null;remain(s);closeDialog();render();showNextPopup();}else if(a==='advice')adviceDialog();else if(a==='continue-career'){s.retirementAdvice.answered=true;s.timeline.push({year:s.year,text:'引退勧告を受け、現役続行を選択'});closeDialog();render();showNextPopup();}else if(a==='choice')choiceDialog();else if(a==='choose'){choose(s,id);closeDialog();render();}else if(a==='training'){s.training=id;render();}else if(a==='random-player'){randomizePlayerForm();startPlayerFromForm($('#new-player'));}else if(a==='new'||a==='edit')requestNewLife();else if(a==='close')closeDialog();else if(a==='stats-open'){tab='stats';recordType=id;filter='all';render();window.scrollTo(0,0);}else if(a==='record-type'){recordType=id;render();}else if(a==='stat-category'){if(['main','fielding'].includes(id))statCategory=id;render();}else if(a==='retire')retirementDialog();else if(a==='afterlife'){startAfterlife(s);render();}else if(a==='retire-confirm'||a==='retire-other'){retire(s,a==='retire-other'?'other':'auto');closeDialog();tab='play';render();window.scrollTo(0,0);}}catch(err){showError(err.message);}finally{if(s&&!a.startsWith('site-')&&!a.startsWith('library-')&&!['final-career','share-result','share-x','share-send','share-download','share-copy','resume','confirm-new','new','edit','close','nav','stats','career','abilities','settings','stats-open','record-type','stat-category','news','more','level-summary'].includes(a)){autoSave();if(saveMessage)render();}}});
document.addEventListener('change',e=>{if(e.target.name==='role'){const value=e.target.value;$('#batter-options').hidden=value!=='batter';$('#pitcher-options').hidden=value!=='pitcher';}if(e.target.name==='positionGroup'){$('#infield-options').hidden=e.target.value!=='infield';$('#outfield-note').hidden=e.target.value!=='outfield';}if(e.target.id==='record-filter'){filter=e.target.value;render();}});

document.addEventListener('submit',e=>{if(e.target.id==='new-player'){e.preventDefault();startPlayerFromForm(e.target);}});

function schoolDetails(c){const x=schoolOutlook(s,c);return `<p><b>${x.recruited?'★ 推薦オファーあり：優先的な実戦機会':'一般入学'}</b><br>夏の甲子園出場見込み 約${x.chance}%<br>出場機会の目安 ${x.opportunity}%<br>全国大会での注目倍率 ${c.scout}倍</p><p class="micro">強豪校ほど全国で評価されやすい一方、控えになるリスクがあります。甲子園での活躍はドラフト評価を上げます。確率は現能力での目安です。</p>`;}
function scoutDialog(){openDialog(`<div class="dialog-head"><h2>高校スカウトからの推薦</h2></div><p>能力が評価され、高校から声がかかりました。中学卒業時の進路選択で推薦先を確認できます。</p>${s.schoolOffers.map(o=>`<p>${o.year}年：${esc(SCHOOLS.find(c=>c.id===o.id)?.name)}</p>`).join('')}${button('scout-dismiss','確認する','primary wide')}`);}
function roleControls(){if(s.retired)return '';if(s.player.role==='batter')return `<details class="panel"><summary>起用：${BATTER_ROLES[s.player.batterRole]||'控え'} ／ 守備位置・スタイル</summary><label>守備位置<select id="position-choice">${Object.entries(POSITIONS).filter(([id])=>id!=='dh').map(([id,n])=>`<option value="${id}" ${(s.player.naturalPosition||s.player.position)===id?'selected':''}>${n}</option>`).join('')}</select></label><label>スタイル<select id="style-choice">${Object.entries(STYLES).map(([id,v])=>`<option value="${id}" ${s.player.style===id?'selected':''}>${v.name}</option>`).join('')}</select></label><p>守備・走力に優れれば守備固め・代走要員、打撃に強みがあり守備や走力が落ちれば代打要員・代打の切り札として起用されます。打撃が伸びればレギュラーへ昇格できます。守備・盗塁の実績も年俸査定に反映します。得意分野が伸びやすくなり、それ以外の成長は控えめになります。変更は今後の成長・試合に反映します。DHはプロ・社会人でのみチーム判断により起用されます。</p>${button('profile-save','設定を反映','secondary')}</details>`;if(!canPitchRole(s))return '';return `<section class="panel"><h2>起用：${PITCH_ROLES[s.player.pitchRole]}</h2><p>希望：${PITCH_ROLES[s.player.roleWish]||'チームに任せる'}。次季の能力・チーム事情で決定します。先発はスタミナ45以上が目安です。</p><div class="quick-links">${Object.entries({auto:'おまかせ',...PITCH_ROLES}).map(([id,n])=>button('pitch-wish',n+'を希望','secondary',`data-id="${id}"`)).join('')}</div></section>`;}

function farmSummary(){const r=s.records.at(-1);if(!r?.levels||!['pro','mlb'].includes(s.stage))return '';const upper=r.stage==='mlb'?'メジャー':'一軍',lower=r.stage==='mlb'?'マイナー':'二軍';return `<details class="panel"><summary>${r.year}年の${upper}・${lower}比較</summary>${table([{...r,label:r.year+'年 '+upper,stats:r.levels.first},{...r,label:r.year+'年 '+lower,stats:r.levels.second}],false)}<p>${upper} ${r.levels.first.games}試合／登板 ・ ${lower} ${r.levels.second.games}試合／登板。通算と詳細は成績メニューへ。</p></details>`;}
function youthDialog(){const n=s.youthNotice;openDialog(`<div class="dialog-head"><h2>${esc(n.name)} 日本代表選出</h2></div><p>${n.year}年、世界の舞台に挑戦。大会結果は${esc(n.result)}でした。</p><p>個人成績と代表歴はキャリア内の日本代表の記録に保存しました。学校の成績とは別集計です。</p>${button('youth-dismiss','確認する','primary wide')}`);}

function middleDetails(c){return `<p class="micro">練習成長 ${c.growth.toFixed(2)}倍 ／ 季節の試合 ${c.games}試合<br>出場しやすさ ${c.opportunity>=1?'高':c.opportunity>=.8?'中':'低'} ／ 全国出場の基礎確率 ${Math.round(c.national*100)}%</p>`;}
function postingGoalView(){const c=s.postingChallenge;if(!c)return '';return `<section class="panel"><h2>ポスティングの条件</h2><p>${c.year}年・${esc(c.team)}：${c.label}<br>${c.status==='achieved'?'達成・球団承認を獲得':c.status==='failed'?'未達成':c.type==='years'?'許可まであと'+Math.max(0,c.eligibleYear-s.year+1)+'シーズン（'+c.eligibleYear+'年終了後）':'今季の条件に挑戦中'}</p><small>${postingApproved(s)?'現在の球団から承認済み。複数年契約中でも申請できます。':c.status==='achieved'?'承認は課題を出した球団でのみ有効です。':''}承認後も海外球団のオファーが必要です。</small>${!eligibility(s,'posting')?button('negotiate','ポスティングを申請する','primary',`data-id="posting"`):`<p class="micro">${esc(eligibility(s,'posting'))}</p>`}</section>`;}
function allStarView(){return `<details class="panel"><summary>オールスター・投票結果</summary><div class="table-wrap"><table><thead><tr><th>年度</th><th>年齢</th><th>所属</th><th>部門</th><th>投票数</th><th>順位</th><th>結果</th></tr></thead><tbody>${(s.allStars||[]).map(a=>`<tr><td>${a.year}</td><td>${a.age??s.records.find(r=>r.year===a.year)?.age??'—'}歳</td><td>${esc(a.team)}</td><td>${esc(a.position)}</td><td>${a.votes.toLocaleString()}票</td><td>${a.rank}位</td><td>${a.selected?'選出・'+a.method:'選外'}</td></tr>`).join('')}</tbody></table></div><p class="micro">架空の競合選手との部門内投票をシミュレーションしています。</p></details>`;}
function honorsView(){return s.honors?.filter(h=>h.title!=='野球殿堂入り').length?`<section class="panel honors"><h2>球史に刻まれた功績</h2>${s.recordHistory?.length?'<p class="micro">シーズン記録は国内一軍・海外メジャーのみ。世界記録は実在の主要リーグの歴史的記録を基準にしたゲーム内の設定です。</p>':''}${s.honors.filter(h=>h.title!=='野球殿堂入り').map(h=>`<p>🏆 ${esc(h.title)} ${h.value!==undefined?`${h.value}（従来 ${h.previous}） ／ ${h.year}年・${h.age}歳 ／ `:''}${esc(h.team)} ${h.title==='永久欠番'?'#'+h.number:''}</p>`).join('')}</section>`:'';}
function nationalOfferDialog(){const n=s.nationalOffers[0];openDialog(`<div class="dialog-head"><h2>${n.name} 日本代表への招集</h2></div><p>出場するか、今季の調整を優先するか選べます。</p><p>出場時：大会による欠場の基礎リスク13%（故障耐性で変動）、調整不足25%。海外選手との交流で成長する可能性55%、海外球団からの評価も上がります。</p><div class="dialog-actions">${button('national-accept','代表として出場する','primary')}${button('national-decline','辞退して調整を優先','secondary')}</div>`);}
function participationReportDialog(){const r=s.participationReport;openDialog(`<h2>${r.name}：${r.result}</h2><ul class="news">${r.effects.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>${button('participation-dismiss','シーズンに戻る','primary wide')}`);}

function clockView(){if(s.stage==='mlb')return '<div class="contract-clock"><b>メジャー登録換算 '+Math.floor(mlbService(s)/172)+'年'+mlbService(s)%172+'日</b><span>FAまで '+Math.max(0,1032-mlbService(s))+'日 ／ 残りオプション '+optionAllowance(s)+'年</span></div>';if(s.stage!=='pro')return '';const c=freeAgencyClock(s);return `<div class="contract-clock"><b>国内プロ実働 ${c.completed}年</b><span>国内FA：${faRemaining(c.rights.domesticDays)}</span><span>海外FA：${faRemaining(c.rights.overseasDays)}</span><span>一軍登録換算：${Math.floor(c.rights.credited/145)}年${c.rights.credited%145}日</span><span>ポスティング：${s.postingChallenge?.status==='pending'&&s.postingChallenge.team===s.team?s.postingChallenge.type==='years'?'球団許可まであと'+Math.max(0,s.postingChallenge.eligibleYear-s.year+1)+'シーズン':'球団の条件に挑戦中':c.posting?'あと'+c.posting+'年':eligibility(s,'posting')?'年数条件クリア':postingApproved(s)?'課題達成・申請可能':'申請可能'}</span><small>${!c.domestic?'国内復帰後の制度です。海外所属中は申請対象外。':c.contractLeft?'FAは契約満了まであと'+c.contractLeft+'年。ポスティングは契約期間中でも球団承認により申請可能。':'海外FAには球団承認不要。ポスティングには能力と球団承認も必要。'}</small><details><summary>FAの取得条件・日数の算定</summary><p>国内FAは原則8年、2007年以降の国内大学・社会人ドラフト入団は7年。海外FAは9年、行使後の再取得は4年。一軍登録145日を1年として、各年の上限は145日です。</p><p>新しいシーズンは日々の登録・抹消を記録して日数を集計します。過去の未記録シーズンのみ推定値です。二軍のみ・育成の期間は加算しません。前年に145日登録された選手の故障は最大60日を加算。投手の登板間隔など日付単位の特例は簡略化しています。</p><a href="${FA_RULES.source}" target="_blank" rel="noopener">NPB公式のFA規定</a></details></div>`;}
function overseasTerms(o){if(o.stage!=='mlb'&&!o.payScale&&!o.postingFee)return '';return '<div class="offer-terms">'+(o.payScale?'<p>メジャー在籍時年額 $'+moneyUsd(o.payScale.majorAnnual).toLocaleString('en-US')+' ／ マイナー在籍時年額 $'+moneyUsd(o.payScale.minorAnnual).toLocaleString('en-US')+'</p>':'')+(o.bonus?'<p>契約金 $'+moneyUsd(o.bonus).toLocaleString('en-US')+'（一回限り・年俸とは別）</p>':'')+(o.postingFee?'<p>球団への譲渡金 '+money(o.postingFee)+'（選手の収入には含まれません）</p>':'')+(!o.payScale&&o.stage==='mlb'?'<p>'+o.years+'年保証・総額 $'+moneyUsd(o.salary*o.years).toLocaleString('en-US')+' ／ 年平均 $'+moneyUsd(o.salary).toLocaleString('en-US')+'</p>':'')+'<small>1ドル＝150円の固定換算</small></div>';}
function offerTerms(o){const g=o.guarantees;if(!g)return incentiveText(o.incentive,o.stage);return `${incentiveText(o.incentive,o.stage)}<div class="offer-terms"><b>${g.label}</b><p>${g.regular?'✓ 契約期間中のレギュラー確約（故障時を除く）':'出場機会は実力・チーム事情で決定'}<br>${g.careerRole?'✓ 引退後の'+(g.careerRole==='manager'?'監督':'コーチ')+'就任保証':'引退後の役職保証なし'}</p>${g.careerRole?'<small>就任後の成績・在任期間は保証されません。</small>':''}</div>`;}
function awardRow(a){const r=s.records.find(r=>r.year===a.year&&r.team===a.team)||s.records.find(r=>r.year===a.year);const st=a.stats||r?.stats,age=a.age??r?.age;const detail=st?(s.player.role==='pitcher'?`防御率 ${era(st).toFixed(2)} ／ ${st.wins}勝 ／ ${innings(st)}回 ／ ${st.so}奪三振 ／ ${st.saves||0}S・${st.holds||0}H`:`打率 ${decimal(avg(st))} ／ ${st.hits}安打 ／ ${st.hr}本塁打 ／ ${st.rbi}打点 ／ ${st.sb}盗塁 ／ 守備貢献 ${(st.defenseRuns||0).toFixed(1)}`):'当時の詳細成績なし';return `<div class="award"><span>☆</span><div><strong>${esc(a.title)}</strong><small>${a.year}年 ／ ${age===undefined?'年齢不明':age+'歳'} ／ ${esc(a.team)}</small><p>${detail}</p></div></div>`;}
function recentNews(){const gains=s.news.filter(n=>/獲得|受賞|選出|優勝|承認|推薦|契約|オファー|天才|損傷|骨折/.test(n));const other=s.news.filter(n=>!gains.includes(n));const rows=[...gains,...other].slice(0,3);return `<section class="recent-news panel"><div class="panel-title"><h2>最近の出来事</h2>${button('news','すべて見る','secondary')}</div><ul>${rows.map(n=>`<li class="${gains.includes(n)?'news-gain':''}">${gains.includes(n)?'★ ':''}${esc(n)}</li>`).join('')}</ul></section>`;}
function afterlifeView(){if(!s.retired)return '';const a=s.afterlife;if(!a)return `<section class="panel"><h2>引退後の人生</h2><p>選手時代の記録を残したまま、その後の物語を作成します。物語もオートセーブに含まれます。引退選手を名鑑へ保存すると、新しい人生を始めた後も振り返れます。</p>${button('afterlife','引退後の物語を読む','primary')}</section>`;return `<section class="panel afterlife"><h2>引退後の人生：${a.route}</h2><p>${a.startAge}歳からの新しい道。優勝 ${a.titles}回 ／ 指導したプロ球団 ${a.teams.length}球団</p><p>${a.reputation}</p><details open><summary>成功も挫折も、その後の物語</summary><div class="afterlife-story">${a.entries.map(e=>`<article><b>${e.year}年・${e.age}歳</b><p>${esc(e.text)}</p></article>`).join('')}</div></details><small>結果はランダムなフィクションです。選手時代の年俸・成績とは別の物語として表示します。</small></section>`;}
function retirementDialog(){const p=careerPromise(s,s.careerPromises?.at(-1));openDialog(`<div class="dialog-head"><h2>現役を引退しますか？</h2>${button('close','×','icon-button')}</div><p>引退後は選手として進行できません。引退は取り消せません。引退後の成績・物語も自動保存されます。次の人生を始める前に名鑑へ保存すると、その後も閲覧できます。</p>${p?`<p>契約時の保証：${esc(p.team)}の${p.role==='manager'?'監督':'コーチ'}に就任できます。</p>`:''}<div class="dialog-actions">${button('close','キャンセル','secondary')}${button('retire-confirm',p?'保証された指導者の道へ':'引退して次の人生へ','primary')}${p?button('retire-other','指導者契約を辞退して別の道へ','secondary'):''}</div>`);}

function incentiveText(i,stage=s.stage){return i?'<p class="offer-terms">出来高：毎年 '+esc(i.label)+'達成で '+displaySalary(i.amount,stage)+'を追加（基本年俸とは別）</p>':'';}
function injuryView(){return '<details class="panel"><summary>故障歴 '+(s.injuries||[]).length+'件</summary>'+(s.injuries||[]).map(i=>'<p>'+i.year+'年・'+i.age+'歳 ／ '+esc(i.name)+' ／ 約'+i.totalDays+'日'+(i.decline?'・後遺症による能力低下':'')+'</p>').join('')+'</details>';}
function careerHigh(){const rows=s.records.filter(r=>['pro','mlb'].includes(r.stage)&&r.stats.games);if(!rows.length)return '<section class="panel"><h2>キャリアハイ</h2><p>国内・海外プロの一軍成績はありません。</p></section>';const pitch=s.player.role==='pitcher',keys=pitch?[['勝利','wins'],['奪三振','so'],['セーブ','saves'],['ホールド','holds']]:[['安打','hits'],['本塁打','hr'],['打点','rbi'],['盗塁','sb']];return '<section class="panel"><h2>キャリアハイ</h2>'+keys.map(([label,key])=>{const best=rows.reduce((a,b)=>(b.stats[key]||0)>(a.stats[key]||0)?b:a);return '<p><b>'+label+' '+(best.stats[key]||0)+'</b> ／ '+best.year+'年・'+best.age+'歳 ／ '+esc(best.team)+'</p>';}).join('')+(()=>{const qualified=rows.filter(r=>pitch?r.stats.outs>=420:r.stats.ab>=440);if(!qualified.length)return '<p>規定相当の打数・投球回に達した年度なし</p>';const best=qualified.reduce((a,b)=>(pitch?era(b.stats)<era(a.stats):avg(b.stats)>avg(a.stats))?b:a);return '<p><b>'+(pitch?'防御率 '+era(best.stats).toFixed(2):'打率 '+decimal(avg(best.stats)))+'</b> ／ '+best.year+'年・'+best.age+'歳 ／ '+esc(best.team)+'（規定相当）</p>';})()+'</section>';}

function injuryAdviceDialog(){
 openDialog('<div class="dialog-head"><h2>大けがと今後の現役生活</h2>'+button('close','×','icon-button')+'</div><p>'+esc(s.injuryAdvice.name)+'により能力が低下しています。療養して復帰を目指すか、引退するかを選んでください。</p><p>復帰まで残り約'+(s.health?.daysLeft||0)+'日。所属先・契約の打診がある場合は、この後に確認できます。</p><div class="dialog-actions">'+button('injury-continue','療養して現役を続ける','primary')+button('retire','引退について考える','secondary')+'</div>');
}
function postingResultDialog(){
 const report=s.postingReport,achieved=report.status==='achieved';
 const reason=eligibility(s,'posting');
 if(achieved&&!reason){
  negotiate(s,'posting',true);marketDialog();
  const content=$('#modal').innerHTML;openDialog('<h2>ポスティング条件：達成</h2><p>'+report.resultYear+'年 ／ '+esc(report.label)+'</p>'+content);
  return;
 }
 const applicable=s.stage==='pro'&&displayNames(report.team)===displayNames(s.team);
 openDialog('<div class="dialog-head"><h2>ポスティング条件：'+(achieved?'達成':'未達成')+'</h2>'+button('close','×','icon-button')+'</div><p>'+report.resultYear+'年 ／ '+esc(report.label)+'</p><p>'+(achieved?esc(reason):report.status==='pending'?'在籍期間の条件は継続中です。あと'+Math.max(0,report.eligibleYear-report.resultYear)+'シーズンです。':'今回は条件を達成できませんでした。次のシーズンの代案を選べます。')+'</p>'+(!achieved&&applicable?'<div class="path-options">'+button('posting-alternative','来季の個人成績で再挑戦','primary','data-id="stats"')+button('posting-alternative','あと1シーズン在籍して許可を得る','secondary','data-id="years"')+button('posting-alternative','現在の条件のまま残留する','secondary','data-id="stay"')+'</div>':button('posting-dismiss','確認して次へ','primary')));
}

function rosterStatusView(){
 if(!['pro','mlb'].includes(s.stage))return '';
 const history=s.rosterHistory?.findLast(r=>r.stage===s.stage&&r.days.at(-1)?.team===s.team);if(history)return '<p><strong>'+history.year+'年末：'+esc(ROSTER_LABELS[history.finalStatus])+'</strong> ／ 登録 '+history.counts.active+'日 ／ '+button('stats-open','登録・抹消を見る','text','data-id="roster"')+'</p>';
 const latest=s.records.at(-1),record=latest?.stage==='pro'&&displayNames(latest.team)===displayNames(s.team)?latest:null;
 const levels=s.currentLevels||record?.levels;
 const label=rosterFromGames(levels,s.contractStatus);
 return '<p class="roster-status"><strong>'+label+'</strong>'+(levels?' ／ '+(s.currentLevels?s.year:record.year)+'年：一軍 '+levels.first.games+'試合・二軍 '+levels.second.games+'試合':' ／ 出場実績はまだありません')+'</p>';
}

function rosterDecisionDialog(){

 if(d.type==='refusal'){openDialog('<h2>マイナー降格拒否後の進路</h2><p>球団と今後の処遇を協議します。トレード先：'+esc(d.tradeTeam)+'</p><div class="dialog-actions">'+button('roster-choice','メジャーで残留','primary','data-id="stay"')+button('roster-choice','トレードで移籍','secondary','data-id="trade"')+button('roster-choice','自由契約','danger','data-id="release"')+'</div>');return;}

}
function rosterResultDialog(result){openDialog('<div class="dialog-head"><h2>ロースター手続きの結果</h2>'+button('close','×','icon-button','aria-label="閉じる"')+'</div><p role="status">'+esc(result.text)+'</p>'+button('roster-result-dismiss','確認して進む','primary wide'));}
function rosterHistoryView(){
 const rows=(s.rosterHistory||[]).slice().reverse();
 return heading('ROSTER','日々の登録・抹消','登録日は休養日も集計。試合に出た日数とは別です。')+button('record-type','成績表に戻る','secondary','data-id="year"')+rows.map(r=>'<details class="panel"><summary>'+r.year+'年 ／ '+esc(r.days[0]?.team)+' ／ '+(r.stage==='mlb'?'メジャー':'一軍')+' '+r.counts.active+'日・ファーム '+r.counts.farm+'日</summary><p>FA算入 '+r.service+'日'+(r.stage==='mlb'?' ／ IL '+r.counts.il+'日 ／ オプション降格 '+r.demotions+'回':' ／ 故障特例 '+r.counts.injuryCredit+'日')+'</p><h3>公示履歴</h3>'+r.transactions.map(t=>'<p>'+t.date+' '+esc(ROSTER_LABELS[t.to]||t.to)+'：'+esc(t.reason)+(t.eligibleDate?' ／ 再登録可能日 '+t.eligibleDate:'')+'</p>').join('')+'<details><summary>日別の登録一覧（'+r.days.length+'日）</summary><div class="table-wrap"><table><thead><tr><th>日付</th><th>状態</th><th>試合出場</th><th>登録日数の対象</th></tr></thead><tbody>'+r.days.map(d=>'<tr><td>'+d.date+'</td><td>'+esc(ROSTER_LABELS[d.status])+'</td><td>'+(d.played?'出場':'—')+'</td><td>'+(d.service?'対象':'—')+'</td></tr>').join('')+'</tbody></table></div></details></details>').join('')+(rows.length?'':'<p>国内・海外プロのシーズンを進めると記録されます。</p>');
}

let sharedCareer=null;
async function showCareerShare(){
 if(!s?.retired)return;
 const player=s;
 openDialog('<div class="dialog-head"><h2>結果をシェア</h2>'+button('close','×','icon-button','aria-label="閉じる"')+'</div><p>キャリアカードを生成しています…</p>');
 const asset=await makeCareerCard(player);
 if(s!==player||!$('#modal').open)return;
 sharedCareer=asset;
 openDialog('<div class="dialog-head"><h2>結果をシェア</h2>'+button('close','×','icon-button','aria-label="閉じる"')+'</div><img style="display:block;width:100%;max-width:432px;height:auto;margin:0 auto" src="'+asset.preview+'" alt="引退後のキャリアカード"><div class="dialog-actions" style="flex-wrap:wrap">'+button('share-x','Xに投稿','primary')+(canShareCareerFile(asset)?button('share-send','共有画面を開く','primary'):'')+button('share-download','画像保存','secondary')+button('share-copy','シェア文章をコピー','secondary')+'</div><p id="share-status" role="status">画像保存・文章コピーでもシェアできます。</p><label>シェア文章<textarea id="share-text" readonly style="display:block;box-sizing:border-box;width:100%;min-height:130px;margin-top:8px">'+esc(asset.text)+'</textarea></label>');
}
async function copyCareerShare(){
 if(!sharedCareer)return;
 try{await navigator.clipboard.writeText(sharedCareer.text);$('#share-status').textContent='シェア文章をコピーしました。';}
 catch{const field=$('#share-text');field.focus();field.select();$('#share-status').textContent='自動コピーに対応していません。選択された文章をコピーしてください。';}
}

let finalCareerOpening=null;
async function openFinalCareer(){
 if(!s?.retired||finalCareerOpening===s)return;
 const player=s;finalCareerOpening=player;render();
 try{await runFinalCareerAd(player,{persist:()=>{if(s===player)autoSave();}});}catch{}
 finally{if(finalCareerOpening===player)finalCareerOpening=null;if(s===player){closeDialog();tab='career';render();window.scrollTo(0,0);}}
}

let libraryCandidate=null,libraryConfirmation=null,libraryViewing=false,libraryBusy=false,libraryRequest=0;
async function openCareerLibrary(message='',navigate=true){
 const request=++libraryRequest;closeDialog();
 if(navigate)rememberSite('library');document.title='選手名鑑｜白球人生';
 const library=await readCareerLibrary();if(request!==libraryRequest||sitePage!=='library')return;
 siteFrame('<div class="dialog-head"><h1>選手名鑑</h1>'+button('site-top','トップへ戻る','secondary')+(s?button('site-game','ゲームへ戻る','secondary'):'')+'</div><p>保存選手 '+(library.storedCount??library.careers.length)+' / '+savedCareerLimit()+'</p>'+(message?'<p role="status">'+esc(message)+'</p>':'')+(library.error?'<p role="alert">'+esc(library.error)+'</p>':'')+library.careers.map(entry=>{
 const p=entry.state,total=sumStats(p.records.filter(r=>['pro','mlb','independent'].includes(r.stage))),summary=p.player.role==='pitcher'?total.wins+'勝 ／ '+total.so+'奪三振 ／ '+total.saves+'セーブ':total.hits+'安打 ／ '+total.hr+'本塁打 ／ '+total.sb+'盗塁';return '<section class="panel"><h3>'+esc(p.player.name)+'</h3><p>'+esc(playerLabel(p))+' ／ '+p.age+'歳で引退 ／ '+p.proYears+'年のプロ生活 ／ 現役 '+p.records.length+'年</p><p>'+summary+'</p><p class="micro">'+esc((p.honors||[]).map(h=>h.title).concat((p.awards||[]).map(a=>a.title)).filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3).join(' ／ ')||'栄誉の記録なし')+'</p><small>'+esc(entry.careerId)+'</small><div class="dialog-actions" style="flex-wrap:wrap">'+button('library-view','詳細を見る','primary','data-id="'+esc(entry.careerId)+'"')+button('library-delete','削除','danger','data-id="'+esc(entry.careerId)+'"')+(libraryCandidate&&libraryCandidate.careerId!==entry.careerId?button('library-replace','この選手と入れ替える','secondary','data-id="'+esc(entry.careerId)+'"'):'')+'</div></section>';
 }).join('')+(!library.careers.length&&!library.error?'<p>保存した引退選手はまだいません。</p>':''));
}
async function confirmLibraryChange(id,replace){
 const entry=(await readCareerLibrary()).careers.find(c=>c.careerId===id);if(!entry)return;
 if(replace&&!libraryCandidate?.retired)return;
 libraryConfirmation={id,replace};
 openDialog('<h2>'+ (replace?'選手を入れ替えますか？':'選手を削除しますか？')+'</h2><p>'+esc(entry.state.player.name)+'の保存記録を削除します。'+(replace?esc(libraryCandidate.player.name)+'を代わりに保存します。':'')+'この操作は取り消せません。</p><div class="dialog-actions">'+button('library-confirm',replace?'入れ替える':'削除する','danger','data-id="'+esc(id)+'"')+button('library-back','キャンセル','secondary')+'</div>');
}
async function viewSavedCareer(id,navigate=true){
 const result=await readCareerLibrary(),entry=result.careers.find(c=>c.careerId===id);if(!entry){openCareerLibrary(result.error||'選手が見つかりません。');return;}
 if(navigate)rememberSite('detail',id);
 const current=s;s=entry.state;libraryViewing=true;
 try{
  const section=(title,body)=>'<details class="panel"><summary>'+title+'</summary>'+body+'</details>';
  const pros=s.records.filter(r=>['pro','mlb','independent'].includes(r.stage));
  const national=s.nationalHistory.filter(r=>r.selected&&r.participated!==false&&r.stats);
  const minor=s.records.filter(r=>r.stage==='mlb'&&r.levels?.second).map(r=>({...r,stats:r.levels.second}));
  const records=[['全年度の成績',s.records],['プロ通算',pros],['国内一軍',levelRows(s.records,'first')],['国内二軍',levelRows(s.records,'second')],['海外メジャー',s.records.filter(r=>r.stage==='mlb')],['海外マイナー',minor],['代表成績',national],['大会成績',s.tournaments]];
  const body='<p>'+esc(playerLabel(s))+' ／ '+s.age+'歳で引退</p>'+((s.careerTypes||[]).length?'<p>'+s.careerTypes.map(esc).join(' ／ ')+'</p>':'')+career()+records.map(([title,rows])=>section(title,table(rows)+section('守備成績',table(rows,true,'fielding')))).join('')+section('獲得タイトル・表彰',s.awards.map(awardRow).join('')||'<p>記録なし</p>')+section('所属球団履歴',teamHistory())+section('背番号履歴',(s.jerseyHistory||[]).map(r=>'<p>'+r.year+'年 ／ '+esc(r.team)+' ／ #'+r.number+'</p>').join('')||'<p>記録なし</p>')+section('契約・最高年俸','<p>最高年俸 '+careerSalary(Math.max(0,...s.records.map(r=>r.salary||0)))+'</p>'+table(s.records.filter(r=>r.salary>0)))+(s.afterlife?section('引退後の人生',afterlifeView()):'');
  document.title=s.player.name+'の最終キャリア｜白球人生';
  siteFrame('<div class="dialog-head"><h1>'+esc(s.player.name)+'の最終キャリア</h1>'+button('library-back','選手名鑑に戻る','secondary')+'</div><p>'+esc(s.careerId)+'</p>'+body);
 }finally{s=current;libraryViewing=false;}
}
</script>
